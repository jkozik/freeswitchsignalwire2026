# Zabbix UserParameters for the FreeSWITCH + SignalWire deployment.
# Backing scripts: /usr/local/bin/freeswitch-check-*.sh
# All FreeSWITCH access goes through /usr/local/bin/fs_cli_zabbix.sh (root,
# via a scoped sudoers rule) — the zabbix user never sees the ESL password
# and is never added to the docker group.

# Returns 1 if the SignalWire gateway is REGED, 0 otherwise.
UserParameter=freeswitch.gateway.state,/usr/local/bin/freeswitch-check-gateway.sh

# Returns 1 if extension 1001 is currently registered, 0 otherwise.
UserParameter=freeswitch.ext1001.registered,/usr/local/bin/freeswitch-check-ext1001.sh

# Returns 1 if entrypoint.sh's secrets templating silently failed (a checked
# var is still on its vars.xml CHANGEME placeholder), 0 if healthy.
UserParameter=freeswitch.secrets.placeholder_detected,/usr/local/bin/freeswitch-check-changeme.sh

# Places a self-contained loopback test call (never rings a real phone,
# see dialplan/default/01_acZabbixHealthcheck.xml). Returns 1 if the call
# originated successfully, 0 otherwise.
UserParameter=freeswitch.loopback.ok,/usr/local/bin/freeswitch-check-loopback.sh
